# Copy to secret.yaml and fill locally, or populate from GitHub Secrets in CI.
# Never apply this empty template to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: posts-api-secret
  namespace: tds-group-3
type: Opaque
stringData:
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_PUBLIC_KEY: ""
  # ADR-011: the same value users-api has, checked on its internal routes.
  INTERNAL_API_TOKEN: ""
