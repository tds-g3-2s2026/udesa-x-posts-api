apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-api
  namespace: tds-group-3
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: posts-api
  template:
    metadata:
      labels:
        app: posts-api
    spec:
      containers:
        - name: posts-api
          # CI must replace ECR_IMAGE with the assigned ECR URI and immutable tag/digest.
          image: "${ECR_IMAGE}"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: posts-api-config
            - secretRef:
                name: posts-api-secret
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
