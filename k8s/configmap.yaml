apiVersion: v1
kind: ConfigMap
metadata:
  name: posts-api-config
  namespace: tds-group-3
data:
  LOG_LEVEL: "INFO"
  FOLLOW_RATE_LIMIT: "50"
  FOLLOW_RATE_WINDOW_SECONDS: "3600"
  JWT_ISSUER: "users-api"
  # Bucket privado de las imagenes de los posts. Las credenciales no van aca ni en el
  # Secret: el pod asume el rol de IAM que declara k8s/deployment.yaml.
  S3_BUCKET: "tds-group-3-media"
  S3_REGION: "us-east-2"
  # ADR-011: users-api by its cluster DNS name, never through the gateway.
  USERS_API_URL: "http://users-api"
  # Raíces de la CA de RDS en us-east-2, copiadas en la imagen (ADR-021). Con
  # ssl=require, asyncpg verifica el certificado contra este archivo; con el
  # bundle del sistema la conexión a RDS falla con CERTIFICATE_VERIFY_FAILED.
  PGSSLROOTCERT: "/etc/ssl/certs/rds-ca-us-east-2.pem"
  # Logs y trazas a Grafana Cloud. El token va en el Secret.
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-sa-east-1.grafana.net/otlp"
