# Copy to secret.yaml and fill locally, or populate from GitHub Secrets in CI.
# Never apply this empty template to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: posts-api-secret
  namespace: tds-group-3
type: Opaque
stringData:
  DATABASE_URL: ""
  REDIS_URL: ""
  # RabbitMQ (ADR-019): where the events of users-api arrive from and where the
  # outbox publishes this service's own.
  RABBITMQ_URL: ""
  # ADR-014: the Redis where users-api writes the revocation marks, database /0.
  # Read only; the service refuses to start without it.
  AUTH_REDIS_URL: ""
  JWT_PUBLIC_KEY: ""
  # ADR-011: the same value users-api has, checked on its internal routes.
  INTERNAL_API_TOKEN: ""
  OTEL_EXPORTER_OTLP_HEADERS: ""
  # Access to the S3 bucket of the post images. The SDK reads these three from the
  # environment. They are temporary credentials: they expire, and the pod needs a new
  # deploy after they are replaced.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
